<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>FinSage - AI Financial Freedom Platform</title>
    <link rel="manifest" href="data:application/manifest+json,{}>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .dark-mode { background: #0f172a; color: #f1f5f9; }
        .dark-mode .card { background: #1e293b; color: #f1f5f9; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); transition: all 0.3s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .sidebar-link { transition: all 0.2s; cursor: pointer; }
        .sidebar-link:hover { background: rgba(59,130,246,0.1); transform: translateX(4px); }
        .notification-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 9999px; width: 18px; height: 18px; font-size: 10px; text-align: center; line-height: 18px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="font-sans antialiased transition-colors duration-300" id="appBody">
    <div id="root"></div>

    <script>
        // ---------- STATE MANAGEMENT ----------
        let currentUser = null;
        let currentPage = 'dashboard';
        let darkMode = localStorage.getItem('darkMode') === 'true';

        // Sample Data (Mock)
        let transactions = [
            { id: 1, type: 'income', desc: 'Salary', amount: 55000, date: '2025-05-01', category: 'salary' },
            { id: 2, type: 'income', desc: 'Freelance', amount: 12500, date: '2025-04-28', category: 'freelance' },
            { id: 3, type: 'expense', desc: 'Rent', amount: 18000, date: '2025-04-25', category: 'housing' },
            { id: 4, type: 'expense', desc: 'Groceries', amount: 3500, date: '2025-04-22', category: 'food' },
            { id: 5, type: 'expense', desc: 'Netflix', amount: 350, date: '2025-04-20', category: 'subscriptions' },
            { id: 6, type: 'income', desc: 'Dividends', amount: 2150, date: '2025-04-15', category: 'investments' },
        ];

        let investments = [
            { id: 1, name: 'S&P 500 ETF', type: 'stock', amount: 125000, value: 142300, change: 13.84 },
            { id: 2, name: 'Bitcoin', type: 'crypto', amount: 45000, value: 52800, change: 17.33 },
            { id: 3, name: 'Gold ETF', type: 'gold', amount: 30000, value: 31500, change: 5.00 },
        ];

        let goals = [
            { id: 1, name: 'Fire by 45', target: 5000000, current: 1350000, deadline: '2030-12-31' },
            { id: 2, name: 'Down Payment', target: 750000, current: 425000, deadline: '2026-06-30' },
        ];

        let users = [
            { id: 1, email: 'demo@finsage.com', password: 'demo123', name: 'Alex Morgan', tier: 'pro', avatar: 'A' }
        ];

        // Helper Functions
        function formatMoney(amount) {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(amount);
        }

        function calculateNetWorth() {
            let totalAssets = investments.reduce((sum, inv) => sum + inv.value, 0);
            let totalIncome = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            let totalExpenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            return totalAssets + (totalIncome - totalExpenses);
        }

        function getFinancialHealth() {
            let savingsRate = (transactions.filter(t => t.type === 'income').reduce((a,b)=>a+b.amount,0) - transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0)) / transactions.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0) || 0;
            if (savingsRate > 0.4) return { score: 92, grade: 'Excellent', color: '#10b981' };
            if (savingsRate > 0.2) return { score: 78, grade: 'Good', color: '#3b82f6' };
            if (savingsRate > 0.1) return { score: 62, grade: 'Fair', color: '#f59e0b' };
            return { score: 45, grade: 'Critical', color: '#ef4444' };
        }

        // ---------- AUTH ----------
        function handleLogin(email, password) {
            let user = users.find(u => u.email === email && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem('finsage_user', JSON.stringify({ id: user.id, name: user.name, email: user.email, tier: user.tier }));
                renderApp();
                return true;
            }
            return false;
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('finsage_user');
            renderApp();
        }

        // ---------- RENDER COMPONENTS ----------
        function renderAuth() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900 p-4">
                    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl p-8 animate-fade-in border border-white/20">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <span class="text-3xl font-black text-white">F</span>
                            </div>
                            <h1 class="text-3xl font-bold text-white">FinSage</h1>
                            <p class="text-slate-300 mt-2">AI-Powered Financial Freedom</p>
                        </div>
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <input type="email" id="loginEmail" placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="demo@finsage.com">
                            </div>
                            <div>
                                <input type="password" id="loginPassword" placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/30 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="demo123">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 rounded-xl transition-all duration-300 transform hover:scale-[1.02]">Sign In →</button>
                        </form>
                        <p class="text-slate-400 text-center text-sm mt-6">Demo: demo@finsage.com / demo123</p>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            let netWorth = calculateNetWorth();
            let health = getFinancialHealth();
            let monthlyIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            let monthlyExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            let savings = monthlyIncome - monthlyExpense;
            let savingsRate = (savings / monthlyIncome * 100).toFixed(1);
            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="card p-6">
                        <p class="text-slate-500 text-sm">Net Worth</p>
                        <h2 class="text-3xl font-bold mt-1">${formatMoney(netWorth)}</h2>
                        <p class="text-emerald-600 text-sm mt-2">↑ +12.4% vs last month</p>
                    </div>
                    <div class="card p-6">
                        <p class="text-slate-500 text-sm">Monthly Cash Flow</p>
                        <h2 class="text-3xl font-bold mt-1">${formatMoney(monthlyIncome)} <span class="text-base font-normal text-slate-400">/ ${formatMoney(monthlyExpense)}</span></h2>
                        <p class="text-emerald-600 text-sm mt-2">Savings: ${formatMoney(savings)} (${savingsRate}%)</p>
                    </div>
                    <div class="card p-6">
                        <p class="text-slate-500 text-sm">Financial Health</p>
                        <div class="flex items-center justify-between">
                            <div>
                                <h2 class="text-3xl font-bold">${health.score}</h2>
                                <p class="text-sm" style="color:${health.color}">${health.grade}</p>
                            </div>
                            <div class="w-16 h-16 rounded-full border-4 border-indigo-200 flex items-center justify-center" style="border-color:${health.color}30">
                                <span class="text-xl font-bold" style="color:${health.color}">${health.score}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="card p-6">
                        <h3 class="font-semibold text-lg mb-4">Investment Performance</h3>
                        <canvas id="portfolioChart" height="200"></canvas>
                    </div>
                    <div class="card p-6">
                        <h3 class="font-semibold text-lg mb-4">AI Insight</h3>
                        <div class="bg-indigo-50 dark:bg-indigo-950/30 p-4 rounded-xl mb-4">
                            <p class="text-indigo-800 dark:text-indigo-300">💡 Based on your spending, increasing savings rate to 30% would reach FIRE 6 years earlier. Start with automated monthly investment of ${formatMoney(Math.floor(savings * 0.3))}.</p>
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800 rounded-xl">
                                <span>Emergency Fund Goal</span>
                                <span class="font-semibold">${formatMoney(monthlyExpense * 6)}</span>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800 rounded-xl">
                                <span>Target FIRE Number (25x)</span>
                                <span class="font-semibold">${formatMoney(monthlyExpense * 12 * 25)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInvestments() {
            setTimeout(() => {
                let ctx = document.getElementById('invChart')?.getContext('2d');
                if(ctx) new Chart(ctx, { type: 'doughnut', data: { labels: investments.map(i => i.name), datasets: [{ data: investments.map(i => i.value), backgroundColor: ['#3b82f6','#f59e0b','#10b981'] }] } });
            }, 50);
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    ${investments.map(inv => `
                        <div class="card p-6">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-slate-500 text-sm">${inv.name}</p>
                                    <h3 class="text-2xl font-bold mt-1">${formatMoney(inv.value)}</h3>
                                    <p class="text-emerald-600 text-sm mt-1">↑ ${inv.change}%</p>
                                </div>
                                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">📈</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="card p-6">
                    <h3 class="font-semibold text-lg mb-4">Portfolio Allocation</h3>
                    <canvas id="invChart" height="200"></canvas>
                </div>
                <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6 rounded-2xl mt-6">
                    <h3 class="text-xl font-bold">🤖 AI Suggestion: Diversify into Emerging Markets ETF</h3>
                    <p class="mt-2 opacity-90">Based on your risk profile, consider allocating 15% to EEM to balance sector exposure.</p>
                </div>
            `;
        }

        function renderFire() {
            let monthlyExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            let fireTarget = monthlyExpense * 12 * 25;
            let currentNetWorth = calculateNetWorth();
            let progress = (currentNetWorth / fireTarget * 100).toFixed(1);
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="card p-6">
                        <p class="text-slate-500 text-sm">FIRE Target (25x Rule)</p>
                        <h2 class="text-3xl font-bold">${formatMoney(fireTarget)}</h2>
                        <div class="mt-4 bg-slate-200 rounded-full h-2"><div class="bg-indigo-600 h-2 rounded-full" style="width:${Math.min(progress,100)}%"></div></div>
                        <p class="mt-2 text-sm">${progress}% Completed</p>
                    </div>
                    <div class="card p-6">
                        <p class="text-slate-500 text-sm">Passive Income Goal</p>
                        <h2 class="text-3xl font-bold">${formatMoney(monthlyExpense)}/month</h2>
                        <p class="mt-2 text-emerald-600">Current: ${formatMoney(monthlyExpense * 0.12)} from dividends</p>
                    </div>
                </div>
                <div class="card p-6">
                    <h3 class="font-semibold text-lg mb-4">Retirement Simulator</h3>
                    <div class="space-y-4">
                        <div><label class="text-sm">Monthly Investment (₺)</label><input type="range" id="investSlider" min="1000" max="20000" value="5000" class="w-full"><span id="sliderVal" class="ml-2 font-mono">₺5,000</span></div>
                        <div><label class="text-sm">Expected Return (%)</label><input type="range" id="returnSlider" min="4" max="12" value="8" class="w-full"><span id="returnVal" class="ml-2 font-mono">8%</span></div>
                        <div class="bg-indigo-50 p-4 rounded-xl"><p id="simResult">Projected FIRE in 16.5 years. You can retire by age 47.</p></div>
                    </div>
                </div>
            `;
        }

        function renderPricing() {
            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="card p-6 text-center"><h3 class="text-2xl font-bold">Basic</h3><p class="text-4xl font-bold mt-4">Free</p><p class="mt-4 text-slate-600">Core dashboard + basic tracking</p><button class="mt-6 w-full py-2 rounded-xl border border-indigo-600 text-indigo-600 hover:bg-indigo-50">Current Plan</button></div>
                    <div class="card p-6 text-center border-2 border-indigo-500"><h3 class="text-2xl font-bold">Pro</h3><p class="text-4xl font-bold mt-4">$9.99<span class="text-base font-normal">/mo</span></p><p class="mt-4 text-slate-600">AI insights + investment suggestions</p><button class="mt-6 w-full py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700">Upgrade</button></div>
                    <div class="card p-6 text-center"><h3 class="text-2xl font-bold">Premium</h3><p class="text-4xl font-bold mt-4">$29.99<span class="text-base font-normal">/mo</span></p><p class="mt-4 text-slate-600">Unlock 1:1 advisor + personalized fire roadmap</p><button class="mt-6 w-full py-2 rounded-xl border border-indigo-600 text-indigo-600">Upgrade</button></div>
                </div>
            `;
        }

        function renderMarketplace() {
            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="card p-6"><img src="https://placehold.co/400x200/indigo/white?text=Ebook" class="rounded-xl mb-4"><h3 class="font-bold">FIRE Playbook</h3><p class="text-2xl font-bold mt-2">₺299</p><button class="mt-4 w-full py-2 bg-indigo-600 text-white rounded-xl">Buy Now</button></div>
                    <div class="card p-6"><img src="https://placehold.co/400x200/emerald/white?text=Course" class="rounded-xl mb-4"><h3 class="font-bold">Passive Income Mastery</h3><p class="text-2xl font-bold mt-2">₺1,499</p><button class="mt-4 w-full bg-indigo-600 text-white rounded-xl py-2">Enroll</button></div>
                    <div class="card p-6"><img src="https://placehold.co/400x200/purple/white?text=Consulting" class="rounded-xl mb-4"><h3 class="font-bold">1:1 Financial Audit</h3><p class="text-2xl font-bold mt-2">₺799</p><button class="mt-4 w-full bg-indigo-600 text-white rounded-xl py-2">Book</button></div>
                </div>
            `;
        }

        function renderSidebar() {
            return `
                <aside class="w-72 bg-white dark:bg-slate-900 shadow-xl p-6 flex flex-col h-screen sticky top-0">
                    <div class="flex items-center gap-3 mb-8"><div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center"><span class="text-white font-bold text-xl">F</span></div><h1 class="text-2xl font-bold">FinSage</h1></div>
                    <nav class="flex-1 space-y-2">
                        ${['dashboard','investments','fire','pricing','marketplace'].map(page => `<div onclick="navigateTo('${page}')" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl ${currentPage===page?'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600':'text-slate-600 dark:text-slate-300'}"><span>${page==='dashboard'?'📊':page==='investments'?'📈':page==='fire'?'🎯':page==='pricing'?'💰':'🛒'}</span><span>${page.charAt(0).toUpperCase()+page.slice(1)}</span></div>`).join('')}
                    </nav>
                    <div class="pt-6 border-t mt-6"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center font-bold">${currentUser?.name[0]||'U'}</div><div><p class="font-medium">${currentUser?.name||'Guest'}</p><p class="text-xs text-slate-500 capitalize">${currentUser?.tier||'basic'}</p></div></div><button onclick="handleLogout()" class="mt-4 w-full py-2 text-red-600 text-sm border border-red-200 rounded-xl">Sign Out</button></div>
                </aside>
            `;
        }

        function navigateTo(page) { currentPage = page; renderApp(); }
        function toggleDark() { darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); renderApp(); }

        function renderApp() {
            if (!currentUser) { document.getElementById('root').innerHTML = renderAuth(); document.getElementById('loginForm')?.addEventListener('submit', (e) => { e.preventDefault(); if(handleLogin(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)) renderApp(); else alert('Invalid credentials'); }); return; }
            let content = `<div class="flex ${darkMode ? 'dark-mode' : ''}"><div>${renderSidebar()}</div><main class="flex-1 p-6 overflow-y-auto h-screen"><div class="flex justify-between items-center mb-6"><div><h2 class="text-3xl font-bold">${currentPage.charAt(0).toUpperCase()+currentPage.slice(1)}</h2><p class="text-slate-500">Welcome back, ${currentUser.name}</p></div><button onclick="toggleDark()" class="p-2 rounded-full hover:bg-slate-200">🌓</button></div><div class="animate-fade-in">${currentPage==='dashboard'?renderDashboard():currentPage==='investments'?renderInvestments():currentPage==='fire'?renderFire():currentPage==='pricing'?renderPricing():renderMarketplace()}</div></main></div>`;
            document.getElementById('root').innerHTML = content;
            if (currentPage === 'fire') {
                document.getElementById('investSlider')?.addEventListener('input', (e) => { document.getElementById('sliderVal').innerText = `₺${parseInt(e.target.value).toLocaleString()}`; document.getElementById('simResult').innerText = `Projected FIRE in ${(60 - (parseInt(e.target.value)/5000)*5).toFixed(1)} years.`;});
                document.getElementById('returnSlider')?.addEventListener('input', (e) => { document.getElementById('returnVal').innerText = `${e.target.value}%`; });
            }
            if (currentPage === 'investments' || (currentPage === 'dashboard' && document.getElementById('portfolioChart'))) {
                setTimeout(() => {
                    let ctx = document.getElementById('portfolioChart')?.getContext('2d');
                    if(ctx) new Chart(ctx, { type: 'line', data: { labels: ['Jan','Feb','Mar','Apr'], datasets: [{ label: 'Portfolio Value', data: [125000,132000,141000,152000], borderColor: '#4f46e5' }] } });
                }, 100);
            }
        }

        // Init
        let saved = localStorage.getItem('finsage_user');
        if (saved) {
            try { currentUser = JSON.parse(saved); } catch(e) {}
        }
        renderApp();
    </script>
</body>
</html>
