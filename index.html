<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FinSage | Finansal Özgürlük Platformu</title>
    <!-- Tailwind CSS + Google Fonts + Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #0a0f2c; /* Lacivert zemin */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        /* Ana container - tam ortalanmış */
        .app-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: #0f1338;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        /* Altın sarısı renkler */
        .text-gold { color: #f5b042; }
        .border-gold { border-color: #f5b042; }
        .bg-gold-light { background: rgba(245, 176, 66, 0.1); }
        .hover\\:bg-gold:hover { background-color: #f5b042; color: #0f1338; }
        .btn-gold { background: #f5b042; color: #0a0f2c; font-weight: 600; transition: all 0.2s; }
        .btn-gold:hover { background: #e09d2c; transform: scale(1.02); }
        .card {
            background: #12173f;
            border-radius: 1.25rem;
            transition: all 0.2s;
            border: 1px solid #1e2556;
        }
        .sidebar-link {
            transition: all 0.2s;
            cursor: pointer;
            border-radius: 0.75rem;
            padding: 0.6rem 1rem;
        }
        .sidebar-link:hover {
            background: rgba(245, 176, 66, 0.15);
            color: #f5b042;
            transform: translateX(4px);
        }
        .active-page {
            background: rgba(245, 176, 66, 0.2);
            color: #f5b042;
            border-right: 2px solid #f5b042;
        }
        /* grafikleri küçültme */
        canvas {
            max-height: 220px;
            width: 100% !important;
        }
        footer a {
            color: #f5b042;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="app-container" id="rootApp"></div>

<script>
    // ---------- STATE ----------
    let currentUser = null;
    let currentPage = 'dashboard';
    
    // Örnek veriler
    let transactions = [
        { id:1, type:'income', desc:'Maaş', amount:55000, date:'2025-05-01' },
        { id:2, type:'income', desc:'Freelance', amount:12500, date:'2025-04-28' },
        { id:3, type:'expense', desc:'Kira', amount:18000, date:'2025-04-25' },
        { id:4, type:'expense', desc:'Market', amount:3500, date:'2025-04-22' },
        { id:5, type:'expense', desc:'Abonelikler', amount:850, date:'2025-04-20' },
        { id:6, type:'income', desc:'Temettü', amount:2150, date:'2025-04-15' },
    ];
    let investments = [
        { id:1, name:'BIST 100', type:'stock', amount:125000, value:142300, change:13.84 },
        { id:2, name:'Bitcoin', type:'crypto', amount:45000, value:52800, change:17.33 },
        { id:3, name:'Altın', type:'gold', amount:30000, value:31500, change:5.0 },
    ];
    let users = [{ id:1, email:'demo@finsage.com', password:'demo123', name:'Ahmet Yılmaz', tier:'pro', avatar:'A' }];
    
    // Yardımcı fonksiyonlar
    function formatMoney(amount) {
        return new Intl.NumberFormat('tr-TR', { style:'currency', currency:'TRY', minimumFractionDigits:0 }).format(amount);
    }
    function calculateNetWorth() {
        let assets = investments.reduce((s,i)=>s+i.value,0);
        let totalIncome = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
        let totalExpense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
        return assets + (totalIncome - totalExpense);
    }
    function getFinancialHealth() {
        let totalIncome = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
        let totalExpense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
        let savingsRate = totalIncome ? (totalIncome - totalExpense)/totalIncome : 0;
        if(savingsRate>0.4) return { score:92, grade:'Mükemmel', color:'#f5b042' };
        if(savingsRate>0.2) return { score:78, grade:'İyi', color:'#f5b042' };
        if(savingsRate>0.1) return { score:62, grade:'Orta', color:'#f5b042' };
        return { score:45, grade:'İyileştirme Gerekli', color:'#f5b042' };
    }
    
    // Auth
    function handleLogin(email, pass) {
        let user = users.find(u=>u.email===email && u.password===pass);
        if(user) { currentUser=user; localStorage.setItem('finsage_user',JSON.stringify({id:user.id,name:user.name,email:user.email,tier:user.tier})); renderApp(); return true; }
        return false;
    }
    function handleLogout() { currentUser=null; localStorage.removeItem('finsage_user'); renderApp(); }
    
    // Sayfalar
    function renderDashboard() {
        let netWorth = calculateNetWorth();
        let health = getFinancialHealth();
        let monthlyIncome = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
        let monthlyExpense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
        let savings = monthlyIncome - monthlyExpense;
        let savingsRate = ((savings/monthlyIncome)*100).toFixed(1);
        setTimeout(() => {
            let ctx = document.getElementById('portfolioChart')?.getContext('2d');
            if(ctx) new Chart(ctx, { type:'line', data:{ labels:['Nis','May','Haz','Tem'], datasets:[{ label:'Portföy Değeri (₺)', data:[136000,142000,151000,162000], borderColor:'#f5b042', backgroundColor:'rgba(245,176,66,0.1)', tension:0.3, fill:true }] }, options:{ responsive:true, maintainAspectRatio:true } });
        }, 100);
        return `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                <div class="card p-5"><p class="text-gray-400 text-sm">Net Varlık</p><h2 class="text-3xl font-bold text-gold mt-1">${formatMoney(netWorth)}</h2><p class="text-emerald-400 text-sm mt-2">↑ Son 30 günde +%6.2</p></div>
                <div class="card p-5"><p class="text-gray-400 text-sm">Aylık Nakit Akışı</p><h2 class="text-3xl font-bold text-gold">${formatMoney(monthlyIncome)} <span class="text-base font-normal text-gray-400">/ ${formatMoney(monthlyExpense)}</span></h2><p class="text-emerald-400 text-sm mt-2">Birikim: ${formatMoney(savings)} (${savingsRate}%)</p></div>
                <div class="card p-5"><p class="text-gray-400 text-sm">Finansal Sağlık Skoru</p><div class="flex justify-between items-center"><div><h2 class="text-3xl font-bold text-gold">${health.score}</h2><p class="text-gold text-sm">${health.grade}</p></div><div class="w-16 h-16 rounded-full border-4 border-gold/50 flex items-center justify-center"><span class="text-xl font-bold text-gold">${health.score}</span></div></div></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card p-5"><h3 class="font-semibold text-gold text-lg mb-3">Portföy Performansı</h3><canvas id="portfolioChart" height="180"></canvas></div>
                <div class="card p-5"><h3 class="font-semibold text-gold text-lg mb-3">Yapay Zeka Öngörüsü</h3><div class="bg-gold-light p-4 rounded-xl mb-4"><p class="text-gold">🧠 Hedefinize ulaşmak için aylık yatırımınızı ${formatMoney(Math.floor(savings*0.3))} seviyesine çıkarın; FIRE tarihiniz 4 yıl öne geçer.</p></div><div class="space-y-3"><div class="flex justify-between p-3 bg-white/5 rounded-xl"><span>Acil Durum Fonu Hedefi</span><span class="font-semibold text-gold">${formatMoney(monthlyExpense*6)}</span></div><div class="flex justify-between p-3 bg-white/5 rounded-xl"><span>FIRE Hedef Portföy (25x)</span><span class="font-semibold text-gold">${formatMoney(monthlyExpense*12*25)}</span></div></div></div>
            </div>
        `;
    }
    function renderInvestments() {
        setTimeout(() => {
            let ctx = document.getElementById('invChart')?.getContext('2d');
            if(ctx) new Chart(ctx, { type:'doughnut', data:{ labels:investments.map(i=>i.name), datasets:[{ data:investments.map(i=>i.value), backgroundColor:['#f5b042','#e0a030','#c98a20'] }] }, options:{ responsive:true, maintainAspectRatio:true } });
        }, 100);
        return `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-7">
                ${investments.map(inv => `<div class="card p-5"><div class="flex justify-between"><div><p class="text-gray-400 text-sm">${inv.name}</p><h3 class="text-2xl font-bold text-gold">${formatMoney(inv.value)}</h3><p class="text-emerald-400 text-sm">↑ ${inv.change}%</p></div><div class="text-3xl">📈</div></div></div>`).join('')}
            </div>
            <div class="card p-5"><h3 class="font-semibold text-gold text-lg mb-3">Varlık Dağılımı</h3><canvas id="invChart" height="200"></canvas></div>
            <div class="mt-6 bg-gold-light p-5 rounded-xl border border-gold/30"><h3 class="text-gold font-bold text-xl">🤖 Yatırım Önerisi: Küresel ETF ekleyin</h3><p class="mt-1 text-gray-300">Risk profilinize göre portföyünüzün %15’ini gelişmekte olan piyasa fonlarına yönlendirin.</p></div>
        `;
    }
    function renderFire() {
        let monthlyExpense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
        let fireTarget = monthlyExpense*12*25;
        let currentNet = calculateNetWorth();
        let progress = (currentNet/fireTarget*100).toFixed(1);
        return `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-7">
                <div class="card p-5"><p class="text-gray-400 text-sm">FIRE Hedefi (25 Kuralı)</p><h2 class="text-3xl font-bold text-gold">${formatMoney(fireTarget)}</h2><div class="mt-3 bg-gray-700 rounded-full h-2"><div class="bg-gold h-2 rounded-full" style="width:${Math.min(progress,100)}%"></div></div><p class="mt-2 text-sm text-gold">%${progress} tamamlandı</p></div>
                <div class="card p-5"><p class="text-gray-400 text-sm">Pasif Gelir Hedefi / Ay</p><h2 class="text-3xl font-bold text-gold">${formatMoney(monthlyExpense)}</h2><p class="text-emerald-400 text-sm">Güncel pasif gelir: ${formatMoney(monthlyExpense*0.13)} (temettü + faiz)</p></div>
            </div>
            <div class="card p-6"><h3 class="font-semibold text-gold text-lg mb-4">Emeklilik Simülatörü</h3><div class="space-y-4"><div><label class="text-sm">Aylık Yatırım (₺)</label><input type="range" id="investSlider" min="1000" max="20000" value="5000" class="w-full accent-gold"><span id="sliderVal" class="ml-3 text-gold font-mono">₺5.000</span></div><div><label class="text-sm">Beklenen Getiri (%)</label><input type="range" id="returnSlider" min="4" max="12" value="8" class="w-full accent-gold"><span id="returnVal" class="ml-3 text-gold font-mono">%8</span></div><div class="bg-gold-light p-4 rounded-xl"><p id="simResult" class="text-gold font-medium">📌 Tahmini FIRE süresi: 16.5 yıl (Emeklilik yaşı: 47)</p></div></div></div>
        `;
    }
    function renderPricing() {
        return `<div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div class="card p-6 text-center"><h3 class="text-2xl font-bold text-gold">Basic</h3><p class="text-4xl font-bold text-gold mt-3">₺0<span class="text-base">/ay</span></p><p class="mt-3 text-gray-300">Temel takip + dashboard</p><button class="mt-6 w-full py-2 rounded-xl border border-gold text-gold hover:bg-gold hover:text-black transition">Mevcut Plan</button></div><div class="card p-6 text-center border-2 border-gold"><h3 class="text-2xl font-bold text-gold">Pro</h3><p class="text-4xl font-bold text-gold mt-3">₺349<span class="text-base">/ay</span></p><p class="mt-3 text-gray-300">Yapay zeka + yatırım önerileri</p><button class="mt-6 w-full py-2 rounded-xl bg-gold text-black font-semibold hover:bg-amber-500 transition">Yükselt</button></div><div class="card p-6 text-center"><h3 class="text-2xl font-bold text-gold">Premium</h3><p class="text-4xl font-bold text-gold mt-3">₺899<span class="text-base">/ay</span></p><p class="mt-3 text-gray-300">Birebir danışmanlık + özel rapor</p><button class="mt-6 w-full py-2 rounded-xl border border-gold text-gold hover:bg-gold hover:text-black transition">Yükselt</button></div></div>`;
    }
    function renderMarketplace() {
        return `<div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div class="card p-5"><img src="https://placehold.co/400x200/1e2556/f5b042?text=FIRE+Kitap" class="rounded-xl w-full object-cover h-32"><h3 class="font-bold text-gold text-lg mt-3">FIRE Yol Haritası</h3><p class="text-gold text-xl font-bold mt-2">₺299</p><button class="mt-3 w-full btn-gold py-2 rounded-xl">Satın Al</button></div><div class="card p-5"><img src="https://placehold.co/400x200/1e2556/f5b042?text=Video+Course" class="rounded-xl w-full object-cover h-32"><h3 class="font-bold text-gold text-lg mt-3">Pasif Gelir Kursu</h3><p class="text-gold text-xl font-bold mt-2">₺1.499</p><button class="mt-3 w-full btn-gold py-2 rounded-xl">Katıl</button></div><div class="card p-5"><img src="https://placehold.co/400x200/1e2556/f5b042?text=Consulting" class="rounded-xl w-full object-cover h-32"><h3 class="font-bold text-gold text-lg mt-3">1:1 Danışmanlık</h3><p class="text-gold text-xl font-bold mt-2">₺799</p><button class="mt-3 w-full btn-gold py-2 rounded-xl">Rezervasyon</button></div></div>`;
    }
    
    // Sidebar ve ana layout
    function renderSidebar() {
        return `
            <aside class="w-72 bg-[#0a0f2c] p-5 flex flex-col h-full sticky top-0 border-r border-[#1e2556]">
                <div class="flex items-center gap-3 mb-8"><div class="w-10 h-10 bg-gold rounded-xl flex items-center justify-center"><span class="text-black font-bold text-xl">F</span></div><h1 class="text-2xl font-bold text-gold">FinSage</h1></div>
                <nav class="flex-1 space-y-1.5">
                    ${[
                        {id:'dashboard', name:'📊 Panel', icon:'📊'},
                        {id:'investments', name:'📈 Yatırımlar', icon:'📈'},
                        {id:'fire', name:'🎯 FIRE', icon:'🎯'},
                        {id:'pricing', name:'💰 Ücretlendirme', icon:'💰'},
                        {id:'marketplace', name:'🛒 Pazaryeri', icon:'🛒'}
                    ].map(p => `<div onclick="navigateTo('${p.id}')" class="sidebar-link ${currentPage===p.id ? 'active-page' : ''}"><span class="mr-3">${p.icon}</span>${p.name}</div>`).join('')}
                </nav>
                <div class="pt-6 border-t border-[#1e2556] mt-4"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-gold/20 rounded-full flex items-center justify-center text-gold font-bold">${currentUser?.name?.[0]||'A'}</div><div><p class="font-medium text-gold">${currentUser?.name||'Misafir'}</p><p class="text-xs text-gray-400 capitalize">${currentUser?.tier||'basic'}</p></div></div><button onclick="handleLogout()" class="mt-5 w-full py-2 text-gold text-sm border border-gold/40 rounded-xl hover:bg-gold hover:text-black transition">Çıkış Yap</button></div>
            </aside>
        `;
    }
    
    // Footer
    function renderFooter() {
        return `
            <footer class="bg-[#0a0f2c] border-t border-[#1e2556] py-6 px-6 text-center text-gray-400 text-sm mt-10">
                <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-3">
                    <a href="#">Hakkımızda</a>
                    <a href="#">KVKK & Gizlilik</a>
                    <a href="#">Kullanım Şartları</a>
                    <a href="#">İletişim</a>
                </div>
                <p>© 2025 FinSage - Finansal Özgürlük Platformu | Tüm hakları saklıdır.</p>
                <p class="mt-1">📧 destek@finsage.com | 📞 +90 555 123 45 67 | İstanbul, Türkiye</p>
                <div class="mt-3 text-gold text-xs">Yatırım tavsiyesi değildir. Danışmanınıza danışın.</div>
            </footer>
        `;
    }
    
    function navigateTo(page) { currentPage = page; renderApp(); }
    
    // Ana render (tam ortalanmış)
    function renderApp() {
        if(!currentUser) {
            document.getElementById('rootApp').innerHTML = `
                <div class="min-h-[600px] flex items-center justify-center p-6">
                    <div class="max-w-md w-full bg-[#12173f] rounded-2xl shadow-2xl p-8 border border-[#1e2556] animate-fade-in">
                        <div class="text-center mb-6"><div class="w-16 h-16 bg-gold rounded-2xl flex items-center justify-center mx-auto mb-3"><span class="text-3xl font-black text-black">F</span></div><h1 class="text-3xl font-bold text-gold">FinSage</h1><p class="text-gray-400 mt-1">AI ile Finansal Bağımsızlık</p></div>
                        <form id="loginForm" class="space-y-4"><div><input type="email" id="loginEmail" placeholder="E-posta" class="w-full p-3 rounded-xl bg-[#0f1338] border border-[#1e2556] text-white focus:outline-none focus:border-gold" value="demo@finsage.com"></div><div><input type="password" id="loginPassword" placeholder="Şifre" class="w-full p-3 rounded-xl bg-[#0f1338] border border-[#1e2556] text-white focus:outline-none focus:border-gold" value="demo123"></div><button type="submit" class="w-full btn-gold py-3 rounded-xl font-bold">Giriş Yap →</button></form>
                        <p class="text-gray-500 text-center text-sm mt-5">Demo: demo@finsage.com / demo123</p>
                    </div>
                </div>${renderFooter()}
            `;
            document.getElementById('loginForm')?.addEventListener('submit', (e) => { e.preventDefault(); if(handleLogin(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)) renderApp(); else alert('Hatalı giriş! demo kullanın'); });
            return;
        }
        // Dashboard ve diğer sayfalar + FOOTER
        let mainContent = `
            <div class="flex flex-col lg:flex-row">
                ${renderSidebar()}
                <main class="flex-1 p-6 bg-[#0f1338] min-h-screen">
                    <div class="flex justify-between items-center mb-5 flex-wrap gap-3"><div><h2 class="text-3xl font-bold text-gold">${currentPage.charAt(0).toUpperCase()+currentPage.slice(1)}</h2><p class="text-gray-300">Merhaba ${currentUser.name}, finansal hedeflerine yaklaşıyorsun.</p></div></div>
                    <div class="animate-fade-in">
                        ${currentPage==='dashboard' ? renderDashboard() : currentPage==='investments' ? renderInvestments() : currentPage==='fire' ? renderFire() : currentPage==='pricing' ? renderPricing() : renderMarketplace()}
                    </div>
                    ${renderFooter()}
                </main>
            </div>
        `;
        document.getElementById('rootApp').innerHTML = mainContent;
        // FIRE slider işlevselliği
        if(currentPage === 'fire') {
            let investSlider = document.getElementById('investSlider');
            let returnSlider = document.getElementById('returnSlider');
            if(investSlider) investSlider.addEventListener('input', (e) => { document.getElementById('sliderVal').innerText = `₺${parseInt(e.target.value).toLocaleString()}`; let years = (60 - (parseInt(e.target.value)/5000)*6).toFixed(1); document.getElementById('simResult').innerHTML = `📌 Tahmini FIRE süresi: ${years} yıl (${new Date().getFullYear()+parseInt(years)} yılı).`; });
            if(returnSlider) returnSlider.addEventListener('input', (e) => { document.getElementById('returnVal').innerText = `%${e.target.value}`; });
        }
        if(currentPage === 'investments' && document.getElementById('invChart')) setTimeout(() => { let c=document.getElementById('invChart')?.getContext('2d'); if(c) new Chart(c, { type:'doughnut', data:{ labels:investments.map(i=>i.name), datasets:[{ data:investments.map(i=>i.value), backgroundColor:['#f5b042','#e09d2c','#cb821d'] }] }, options:{ responsive:true } }); }, 150);
    }
    
    // Başlangıç
    let saved = localStorage.getItem('finsage_user');
    if(saved) { try{ currentUser=JSON.parse(saved); }catch(e){} }
    renderApp();
</script>
</body>
</html>
